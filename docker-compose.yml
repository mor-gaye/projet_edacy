services:
  front:
    build:
      context: ./front
    ports:
      - "3000:3000"
    volumes:
      - ./front/src:/app/src
      - ./front/public:/app/public
    depends_on:
      - back

  back:
    build:
      context: ./back
    ports:
      - "3001:3001"
    volumes:
      - ./back/src:/app/src
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=
      - DB_NAME=edacy
    depends_on:
      - db
    restart: always
  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD="yes"
      - MYSQL_DATABASE=edacy
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password
    restart: always

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - "8080:80"      # localhost:8080 pour y accéder
    environment:
      PMA_HOST: db     # doit correspondre au nom du service MySQL
      MYSQL_ROOT_PASSWORD:
    depends_on:
      - db

volumes:
  mysql_data:


